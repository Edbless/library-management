<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title>Books List</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">

<h2>Books</h2>

<a href="/books/save" class="btn btn-primary mb-3">Add Book</a>

<table class="table table-bordered">
    <thead class="table-dark">
    <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Year Published</th>
        <th>Quantity</th>
        <th>Author</th>
        <th>Librarian</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="book : ${books}">
        <td th:text="${book.id}"></td>
        <td th:text="${book.title}"></td>
        <td th:text="${book.yr_published}"></td>
        <td th:text="${book.quantity}"></td>
        <td th:text="${book.author != null ? book.author.fullName : '—'}"></td>
        <td th:text="${book.librarian != null ? book.librarian.fullName : '—'}"></td>
        <td>
            <a th:href="@{'/books/edit/' + ${book.id}}" class="btn btn-warning btn-sm">Edit</a>
            <a th:href="@{'/books/delete/' + ${book.id}}" class="btn btn-danger btn-sm">Delete</a>
        </td>
    </tr>
    </tbody>
</table>
    <a th:href="@{/dashboard}" class="btn btn-secondary mt-3">Back to Dashboard</a>
</body>
</html>
