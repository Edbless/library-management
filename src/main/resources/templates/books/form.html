<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title>Book Form</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">

<h2 th:text="${book.id != null} ? 'Edit Book' : 'Add Book'"></h2>

<form th:action="@{/books/save}" th:object="${book}" method="post">
    <div class="mb-3">
        <label class="form-label">Title
            <input type="text" class="form-control" th:field="*{title}" required>
        </label>
    </div>

    <div class="mb-3">
        <label class="form-label">Year Published
            <input type="date" class="form-control" th:field="*{yr_published}" required>
        </label>
    </div>

    <div class="mb-3">
        <label class="form-label">Quantity
            <input type="number" class="form-control" th:field="*{quantity}" required>
        </label>
    </div>

    <div class="mb-3">
        <label class="form-label">Author
        <select class="form-select" th:field="*{author}">
            <option value="">-- Select Author --</option>
            <option th:each="a : ${authors}" th:value="${a.id}" th:text="${a.fullName}"></option>
        </select>
        </label>
    </div>

    <div class="mb-3">
        <label class="form-label">Librarian
        <select class="form-select" th:field="*{librarian}">
            <option value="">-- Select Librarian --</option>
            <option th:each="l : ${librarians}" th:value="${l.id}" th:text="${l.fullName}"></option>
        </select>
        </label>
    </div>

    <button type="submit" class="btn btn-success">Save</button>
    <a href="/books" class="btn btn-secondary">Cancel</a>
</form>

</body>
</html>
