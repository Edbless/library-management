<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Authors</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-primary">Authors</h2>
        <a th:href="@{/authors/add}" class="btn btn-success">Add Author</a>
    </div>

    <table class="table table-striped table-bordered shadow-sm">
        <thead class="table-primary">
        <tr>
            <th>ID</th>
            <th>Full Name</th>
            <th>Contact</th>
            <th>Address</th>
            <th>Books Written</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="author : ${authors}">
            <td th:text="${author.id}"></td>
            <td th:text="${author.fullName}"></td>
            <td th:text="${author.contact}"></td>
            <td th:text="${author.address}"></td>
            <td>
                <span th:each="book : ${author.books}" th:text="${book.title + ', '}" />
            </td>
            <td>
                <a th:href="@{'/authors/delete'(id=${author.id})}" class="btn btn-danger btn-sm">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>

    <a th:href="@{/books/list}" class="btn btn-secondary mt-3">Back to Books</a>
    <a th:href="@{/dashboard}" class="btn btn-secondary mt-3">Back to Dashboard</a>
</div>
</body>
</html>
