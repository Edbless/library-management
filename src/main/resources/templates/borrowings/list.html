<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Borrowings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-primary">Borrowings</h2>
        <a th:href="@{/borrowings/add}" class="btn btn-success">Add Borrowing</a>
    </div>

    <table class="table table-bordered table-striped shadow-sm">
        <thead class="table-primary">
        <tr>
            <th>ID</th>
            <th>Book Title</th>
            <th>Author</th>
            <th>Student</th>
            <th>Borrowed Date</th>
            <th>Return Date</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="borrowing : ${borrowings}">
            <td th:text="${borrowing.id}"></td>
            <td th:text="${borrowing.book != null ? borrowing.book.title : borrowing.borrowedBookTitle}"></td>
            <td th:text="${borrowing.book != null ? borrowing.book.author.fullName : borrowing.borrowedBookAuthor}"></td>
            <td th:text="${borrowing.student != null ? borrowing.student.fullName : '—'}"></td>
            <td th:text="${borrowing.borrowedDate}"></td>
            <td th:text="${borrowing.returnDate}"></td>
            <td>
                <a th:href="@{'/borrowings/delete'(id=${borrowing.id})}" class="btn btn-danger btn-sm">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>

    <a th:href="@{/students/list}" class="btn btn-secondary mt-3">Back to Students</a>
    <a th:href="@{/dashboard}" class="btn btn-secondary mt-3">Back to Dashboard</a>
</div>
</body>
</html>
