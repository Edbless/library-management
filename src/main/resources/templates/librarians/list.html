<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Librarians</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-primary">Librarian Management</h2>
        <a th:href="@{/librarians/add}" class="btn btn-success">Add Librarian</a>
    </div>

    <table class="table table-striped table-bordered shadow-sm">
        <thead class="table-primary">
        <tr>
            <th>ID</th>
            <th>Full Name</th>
            <th>Email</th>
            <th>Phone Number</th>
            <th>Password</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="librarian : ${librarians}">
            <td th:text="${librarian.id}"></td>
            <td th:text="${librarian.fullName}"></td>
            <td th:text="${librarian.email}"></td>
            <td th:text="${librarian.phoneNumber}"></td>
            <td th:text="${librarian.password}"></td>

            <td>
                <a th:href="@{'/librarians/delete'(id=${librarian.id})}" class="btn btn-danger btn-sm">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>

    <a th:href="@{/dashboard}" class="btn btn-secondary mt-3">Back to Dashboard</a>
</div>
</body>
</html>
