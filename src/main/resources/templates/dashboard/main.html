<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Library Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">

    <h1 class="mb-5 text-center text-primary fw-bold">📚 Library Resource Dashboard</h1>

    <div class="d-flex flex-wrap justify-content-center gap-4">

        <!-- Students -->
        <div class="card text-center shadow-lg border-0" style="width: 20rem; height: 18rem;">
            <div class="card-body d-flex flex-column justify-content-center align-items-center">
                <i class="bi bi-people-fill text-primary" style="font-size: 3rem;"></i>
                <h5 class="card-title mt-2">Students</h5>
                <p class="card-text fs-4 fw-bold text-dark" th:text="${studentCount}">0</p>
                <a th:href="@{/students/list}" class="btn btn-outline-primary btn-sm">Manage</a>
            </div>
        </div>

        <!-- Books -->
        <div class="card text-center shadow-lg border-0" style="width: 20rem; height: 18rem;">
            <div class="card-body d-flex flex-column justify-content-center align-items-center">
                <i class="bi bi-book-half text-success" style="font-size: 3rem;"></i>
                <h5 class="card-title mt-2">Books</h5>
                <p class="card-text fs-4 fw-bold text-dark" th:text="${bookCount}">0</p>
                <a th:href="@{/books/list}" class="btn btn-outline-success btn-sm">Manage</a>
            </div>
        </div>

        <!-- Authors -->
        <div class="card text-center shadow-lg border-0" style="width: 20rem; height: 18rem;">
            <div class="card-body d-flex flex-column justify-content-center align-items-center">
                <i class="bi bi-pen-fill text-warning" style="font-size: 3rem;"></i>
                <h5 class="card-title mt-2">Authors</h5>
                <p class="card-text fs-4 fw-bold text-dark" th:text="${authorCount}">0</p>
                <a th:href="@{/authors/list}" class="btn btn-outline-warning btn-sm">Manage</a>
            </div>
        </div>

        <!-- Borrowings -->
        <div class="card text-center shadow-lg border-0" style="width: 20rem; height: 18rem;">
            <div class="card-body d-flex flex-column justify-content-center align-items-center">
                <i class="bi bi-arrow-left-right text-danger" style="font-size: 3rem;"></i>
                <h5 class="card-title mt-2">Borrowings</h5>
                <p class="card-text fs-4 fw-bold text-dark" th:text="${borrowingCount}">0</p>
                <a th:href="@{/borrowings/list}" class="btn btn-outline-danger btn-sm">Manage</a>
            </div>
        </div>

        <!-- Librarians -->
        <div class="card text-center shadow-lg border-0" style="width: 20rem; height: 18rem;">
            <div class="card-body d-flex flex-column justify-content-center align-items-center">
                <i class="bi bi-person-badge-fill text-info" style="font-size: 3rem;"></i>
                <h5 class="card-title mt-2">Librarians</h5>
                <p class="card-text fs-4 fw-bold text-dark" th:text="${librarianCount}">0</p>
                <a th:href="@{/librarians/list}" class="btn btn-outline-info btn-sm">Manage</a>
            </div>
        </div>

    </div>

</div>

</body>
</html>
