<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Library Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">

    <h1 class="mb-4 text-primary">Library Dashboard</h1>

    <div class="row g-4">

        <div class="col-md-2">
            <div class="card text-center shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Students</h5>
                    <p class="card-text" th:text="${studentCount}">0</p>
                    <a th:href="@{/students/list}" class="btn btn-primary btn-sm">Manage</a>
                </div>
            </div>
        </div>

        <div class="col-md-2">
            <div class="card text-center shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Books</h5>
                    <p class="card-text" th:text="${bookCount}">0</p>
                    <a th:href="@{/books/list}" class="btn btn-primary btn-sm">Manage</a>
                </div>
            </div>
        </div>

        <div class="col-md-2">
            <div class="card text-center shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Authors</h5>
                    <p class="card-text" th:text="${authorCount}">0</p>
                    <a th:href="@{/authors/list}" class="btn btn-primary btn-sm">Manage</a>
                </div>
            </div>
        </div>

        <div class="col-md-2">
            <div class="card text-center shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Borrowings</h5>
                    <p class="card-text" th:text="${borrowingCount}">0</p>
                    <a th:href="@{/borrowings/list}" class="btn btn-primary btn-sm">Manage</a>
                </div>
            </div>
        </div>

        <div class="col-md-2">
            <div class="card text-center shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Librarians</h5>
                    <p class="card-text" th:text="${librarianCount}">0</p>
                    <a th:href="@{/librarians/list}" class="btn btn-primary btn-sm">Manage</a>
                </div>
            </div>
        </div>

    </div>

</div>
</body>
</html>
