<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Student</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">

    <div class="card shadow-lg border-0 rounded-3">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Add Student</h4>
        </div>
        <div class="card-body">
            <form th:action="@{/students/save}" th:object="${student}" method="post">

                <div class="mb-3">
                    <label class="form-label">Full Name
                        <input type="text" th:field="*{fullName}" class="form-control" placeholder="Enter full name" required>
                    </label>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email
                        <input type="email" th:field="*{email}" class="form-control" placeholder="Enter email" required>
                    </label>
                </div>

                <div class="mb-3">
                    <label class="form-label">Phone Number
                    <input type="text" th:field="*{phoneNumber}" class="form-control" placeholder="Enter phone number" required>
                    </label>
                </div>

                <div class="mb-3">
                    <label class="form-label">Address
                        <input type="text" th:field="*{address}" class="form-control" placeholder="Enter address" required>
                    </label>
                </div>

                <div class="mb-3">
                    <label class="form-label">Librarian
                    <select class="form-select" th:field="*{librarian}" required>
                        <option value="">-- Select Librarian --</option>
                        <option th:each="l : ${librarians}" th:value="${l.id}" th:text="${l.name}"></option>
                    </select>
                    </label>
                </div>

                <div class="d-flex justify-content-end">
                    <button type="submit" class="btn btn-success me-2">Save</button>
                    <a th:href="@{/students/list}" class="btn btn-secondary">Cancel</a>
                </div>

            </form>
        </div>
    </div>

</div>
</body>
</html>
